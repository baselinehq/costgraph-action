name: CostGraph Terraform cost
description: Estimate the monthly cost of Terraform changes on any cloud, with cheaper same-shape alternatives, in one pull request comment.
author: CostGraph
branding:
  icon: dollar-sign
  color: blue
inputs:
  api-key:
    description: CostGraph API key. Store it as a repository secret.
    required: true
  plan-path:
    description: Terraform plan in JSON (terraform show -json). One path per line to review several plans in one comment.
    required: true
  github-token:
    description: Token used to post the pull request comment. Needs pull-requests write.
    default: ${{ github.token }}
  comment:
    description: Post the estimate as a pull request comment. The job summary is always written.
    default: 'true'
  comment-behavior:
    description: update edits the earlier cost comment in place, new posts a new comment on every run.
    default: update
  alternatives:
    description: Show the same machine shape at other providers with its monthly cost.
    default: 'true'
  extra-args:
    description: Extra arguments for costgraph cost breakdown, one argument per line.
    default: ''
  summary-format:
    description: Job summary layout, github-comment (the same markdown as the comment) or table.
    default: github-comment
  fail-on-error:
    description: Fail the job when the estimate cannot be produced. Set false to report a warning instead.
    default: 'true'
  cli-version:
    description: CostGraph CLI release to use, such as v0.5.0, or latest.
    default: latest
  infracost:
    description: Install and run Infracost for AWS, Azure and Google Cloud resources. When false, those resources are left out of the estimate.
    default: 'true'
  infracost-version:
    description: Infracost release to use. The default release has checksums pinned in this action.
    default: v0.10.46
  api-url:
    description: CostGraph API base URL.
    default: https://api.costgraph.ai
  pricing-url:
    description: CostGraph pricing URL used for alternatives. Empty uses the CLI default.
    default: ''
  github-api-url:
    description: GitHub API URL, for GitHub Enterprise Server.
    default: ${{ github.api_url }}
  working-directory:
    description: Directory that plan-path is relative to.
    default: .
  output-path:
    description: Where to write the estimate file (Infracost JSON 0.2, all plans merged). Relative to working-directory. Defaults to a file in the runner's temp directory.
    default: ''
  artifact-name:
    description: Upload the estimate file as a workflow artifact with this name. Empty skips the upload.
    default: ''
outputs:
  total-monthly-cost:
    description: Monthly cost after the change, in the estimate currency (USD by default).
    value: ${{ steps.review.outputs.total-monthly-cost }}
  previous-monthly-cost:
    description: Monthly cost before the change. Empty when part of the estimate has no previous cost.
    value: ${{ steps.review.outputs.previous-monthly-cost }}
  diff-monthly-cost:
    description: Change in monthly cost. Empty when part of the estimate has no previous cost.
    value: ${{ steps.review.outputs.diff-monthly-cost }}
  comment-url:
    description: URL of the pull request comment, empty when no comment was posted.
    value: ${{ steps.review.outputs.comment-url }}
  estimate-path:
    description: Absolute path of the estimate file (Infracost JSON 0.2, all plans merged).
    value: ${{ steps.review.outputs.estimate-path }}
runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
        INSTALL_INFRACOST: ${{ inputs.infracost }}
        INFRACOST_VERSION: ${{ inputs.infracost-version }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/setup.sh"
    - id: review
      shell: bash
      continue-on-error: ${{ inputs.fail-on-error == 'false' }}
      working-directory: ${{ inputs.working-directory }}
      env:
        COSTGRAPH_API_KEY: ${{ inputs.api-key }}
        COSTGRAPH_API_URL: ${{ inputs.api-url }}
        COSTGRAPH_PRICING_URL: ${{ inputs.pricing-url }}
        COSTGRAPH_GITHUB_TOKEN: ${{ inputs.github-token }}
        PLAN_PATHS: ${{ inputs.plan-path }}
        POST_COMMENT: ${{ inputs.comment }}
        COMMENT_BEHAVIOR: ${{ inputs.comment-behavior }}
        ALTERNATIVES: ${{ inputs.alternatives }}
        RUN_INFRACOST: ${{ inputs.infracost }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        SUMMARY_FORMAT: ${{ inputs.summary-format }}
        COSTGRAPH_GITHUB_API_URL: ${{ inputs.github-api-url }}
        OUTPUT_PATH: ${{ inputs.output-path }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/review.sh"
    - if: inputs.artifact-name != '' && steps.review.outputs.estimate-path != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.review.outputs.estimate-path }}
        if-no-files-found: error
    - if: steps.review.outcome == 'failure'
      shell: bash
      run: echo "::warning::The CostGraph cost estimate could not be produced; see the review step log. fail-on-error is false, so the job continues."
