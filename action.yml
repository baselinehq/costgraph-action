name: CostGraph CLI setup
description: Install the CostGraph CLI, checksum-verified, with optional cloud pricing for AWS, Azure and Google Cloud wired to CostGraph.
author: CostGraph
branding:
  icon: dollar-sign
  color: blue
inputs:
  cli-version:
    description: CostGraph CLI release to install, such as v0.5.0, or latest.
    default: latest
  infracost:
    description: Also install Infracost, which prices AWS, Azure and Google Cloud resources.
    default: 'true'
  infracost-version:
    description: Infracost release to install. The default release has checksums pinned in this action.
    default: v0.10.46
  api-key:
    description: Optional CostGraph API key. When set, later steps run Infracost against CostGraph pricing without further setup.
    default: ''
  api-url:
    description: CostGraph API base URL.
    default: https://api.costgraph.ai
outputs:
  cli-version:
    description: The CostGraph CLI release that was installed.
    value: ${{ steps.install.outputs.cli-version }}
  infracost-version:
    description: The Infracost release that was installed, empty when Infracost was not installed.
    value: ${{ steps.install.outputs.infracost-version }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
        INSTALL_INFRACOST: ${{ inputs.infracost }}
        INFRACOST_VERSION: ${{ inputs.infracost-version }}
        COSTGRAPH_API_KEY: ${{ inputs.api-key }}
        COSTGRAPH_API_URL: ${{ inputs.api-url }}
        EXPORT_INFRACOST_ENV: 'true'
        ACTION_REF: ${{ github.action_ref }}
        ACTION_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/setup.sh"
