name: Move major version tag

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      id-token: write
    outputs:
      runners: ${{ steps.route.outputs.runners }}
    steps:
      - id: route
        uses: baselinehq/costgraph-action/route@v0
        with:
          default: ubicloud-standard-2
          release: 'true'

  move:
    needs: [route]
    if: ${{ !cancelled() && (!github.event.release.prerelease) }}
    runs-on: ${{ fromJSON(needs.route.outputs.runners || '{}').move || 'ubicloud-standard-2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point the major tag at this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::notice::$TAG is not a vX.Y.Z release; the major tag is unchanged"; exit 0; }
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"
