name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck
        run: shellcheck scripts/*.sh

  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./
      - name: Check the installed versions
        env:
          CLI_VERSION: ${{ steps.setup.outputs.cli-version }}
          INFRACOST_VERSION: ${{ steps.setup.outputs.infracost-version }}
        run: |
          set -euo pipefail
          costgraph version | grep -F "${CLI_VERSION#v}"
          infracost --version | grep -F "$INFRACOST_VERSION"

  review:
    runs-on: ubuntu-latest
    env:
      HAS_API_KEY: ${{ secrets.COSTGRAPH_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.HAS_API_KEY != 'true'
        run: echo "::notice::COSTGRAPH_API_KEY is not available to this run, so the pricing self-test is skipped."
      - id: review
        if: env.HAS_API_KEY == 'true'
        uses: ./terraform-cost
        with:
          api-key: ${{ secrets.COSTGRAPH_API_KEY }}
          plan-path: examples/digitalocean-plan.json
          comment: 'false'
          fail-on-error: 'false'
      - if: env.HAS_API_KEY == 'true'
        env:
          TOTAL: ${{ steps.review.outputs.total-monthly-cost }}
        run: echo "Total monthly cost for the example plan is ${TOTAL:-not available}"
